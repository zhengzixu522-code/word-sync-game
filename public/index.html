<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>同频词语</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section id="homeView" class="card hero-card">
      <div class="logo">同频</div>
      <p class="eyebrow">TWO PLAYER WORD GAME</p>
      <h1>看看你们要几轮，<br>才能想到同一个词。</h1>
      <p class="sub">两个人同时写词。不同就看对方答案，再用 20 秒继续联想；直到你们写出同一个词。</p>

      <label class="field-label" for="nickname">你的昵称</label>
      <input id="nickname" class="text-input" maxlength="12" placeholder="例如：小陈" autocomplete="off" />

      <div class="home-actions">
        <button id="createBtn" class="primary-btn">创建房间</button>
        <button id="showJoinBtn" class="secondary-btn">加入房间</button>
      </div>

      <div id="joinBox" class="join-box hidden">
        <label class="field-label" for="roomCodeInput">房间号</label>
        <div class="inline-row">
          <input id="roomCodeInput" class="text-input code-input" maxlength="5" placeholder="ABCDE" autocomplete="off" />
          <button id="joinBtn" class="primary-btn compact">加入</button>
        </div>
      </div>
      <p id="homeError" class="error-text"></p>
    </section>

    <section id="gameView" class="hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">ROOM</p>
          <div class="room-line">
            <strong id="roomCodeText">-----</strong>
            <button id="copyCodeBtn" class="icon-btn" aria-label="复制房间号">复制</button>
          </div>
        </div>
        <div class="round-pill">第 <span id="roundText">1</span> 轮</div>
      </header>

      <section id="waitingPanel" class="card state-card">
        <div class="pulse-dot"></div>
        <h2>等待另一名玩家加入</h2>
        <p>把房间号发给对方。对方加入后会自动开始。</p>
      </section>

      <section id="playPanel" class="card game-card hidden">
        <div class="status-row">
          <span id="statusBadge" class="status-badge">写下你的词</span>
          <span id="timerText" class="timer hidden">20</span>
        </div>

        <div id="revealArea" class="reveal-area hidden">
          <div class="word-card">
            <span id="p1Name">玩家1</span>
            <strong id="p1Word">—</strong>
          </div>
          <div class="vs">×</div>
          <div class="word-card">
            <span id="p2Name">玩家2</span>
            <strong id="p2Word">—</strong>
          </div>
        </div>

        <div id="matchBanner" class="match-banner hidden">
          <div class="confetti">✦</div>
          <h2>同频成功！</h2>
          <p id="matchText">你们想到了同一个词。</p>
        </div>

        <div id="inputArea" class="input-area">
          <label id="promptText" class="field-label" for="wordInput">先写下你想到的第一个词</label>
          <input id="wordInput" class="text-input word-input" maxlength="30" placeholder="输入一个词语" autocomplete="off" />
          <button id="submitWordBtn" class="primary-btn">锁定这个词</button>
          <p id="submitHint" class="small-hint">提交后，在对方提交前不会显示你的答案。</p>
          <p id="gameError" class="error-text"></p>
        </div>

        <button id="restartBtn" class="secondary-btn hidden">重新开始</button>
      </section>

      <section class="history-section">
        <div class="section-title-row">
          <h3>联想轨迹</h3>
          <span id="historyCount">0 轮</span>
        </div>
        <div id="historyList" class="history-list">
          <p class="empty-history">还没有揭晓过词语。</p>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
